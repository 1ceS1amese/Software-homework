name: Local development checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and native browser dependencies
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Check patch whitespace
        run: git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol show --format= --check HEAD
      - name: Check shell syntax, types and build
        run: ./scripts/check.sh
      - name: Unit and mocked browser tests
        run: ./scripts/test.sh
